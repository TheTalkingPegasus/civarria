# Baut das Windows-Setup und veröffentlicht es als GitHub-Release.
# Auslöser: eine neue Versionsnummer in package.json (Push auf main) oder von Hand über „Run workflow“.
# Gibt es das Release zur Version schon, passiert nichts.
# Installierte Programme finden das neue Release beim Start und aktualisieren sich.
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install
      - run: npm run build
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
